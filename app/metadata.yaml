title: NLS 
description_html: |-
  <p>The Nepalese Linguistic Survey offers lexical data for more than 50 language varieties of Nepal.
  </p>
settings:
  truncate_cells_html: 0
default_page_size: 20
license: CC-BY-4.0
port: 8002
extra_css_urls:
  - /assets/app.css
databases:
  NLS:
    tables:
      Languages:
        size: 20
        columns:
      Concepts:
        size: 20
        description_html: <p>Concepts recurring in CLIPS.</p>
      Forms:
        size: 20
    queries:
      SoundPatterns:
        title: Sound Patterns
        sql: |-
          SELECT ROW_NUMBER() OVER() as ID,
            Language_ID,
            Language,
            Sound,
            COUNT(Form_ID) as Frequency
          FROM Sounds
          WHERE Sound != '+'
          GROUP BY Language_ID, Language, Sound
          ORDER BY Language, Sound;
          

